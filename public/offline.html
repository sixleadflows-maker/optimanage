<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — EyeSpy</title>
  <style>
    :root { --bg: #f6f5fb; --card: #ffffff; --text: #1b1a22; --muted: #6b6980; --primary: #6d5ef0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111018; --card: #1c1b25; --text: #f1f0f7; --muted: #a3a1b5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { background: var(--card); border-radius: 20px; padding: 32px 28px; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    h1 { font-size: 18px; margin: 14px 0 6px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
      padding: 11px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; }
    .icon { width: 44px; height: 44px; margin: 0 auto; border-radius: 12px; display: grid; place-items: center;
      background: rgba(109,94,240,.12); color: var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>No internet connection</h1>
    <p>This page needs a connection. The till still works: bills print straight away and are recorded by themselves once the internet is back.</p>
    <a href="/dashboard/pos">Open the till</a>
  </div>
</body>
</html>
